name: Fuel monitor

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: Build the summary without publishing it
        required: false
        default: true
        type: boolean
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read

concurrency:
  group: fuel-monitor-hourly
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELETHON_SESSION_NAME: ${{ github.workspace }}/fuel_monitor
      DRY_RUN: ${{ github.event_name == 'workflow_dispatch' && inputs.dry_run || '0' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Restore Telethon session
        env:
          TELETHON_SESSION_B64: ${{ secrets.TELETHON_SESSION_B64 }}
        run: |
          python - <<'PY'
          import base64
          import os

          encoded = os.environ["TELETHON_SESSION_B64"]
          with open("fuel_monitor.session", "wb") as session_file:
              session_file.write(base64.b64decode(encoded, validate=False))
          PY
      - name: Run fuel monitor
        run: python -m app.runner
