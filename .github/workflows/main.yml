name: Fuel monitor

on:
  schedule:
    - cron: '7 * * * *'
  workflow_dispatch:
    inputs:
      publish:
        description: Allow real Telegram publication
        required: true
        default: false
        type: boolean

permissions:
  contents: write

concurrency:
  group: fuel-monitor-production
  cancel-in-progress: false

jobs:
  monitor:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_API_ID: ${{ secrets.TELEGRAM_API_ID }}
      TELEGRAM_API_HASH: ${{ secrets.TELEGRAM_API_HASH }}
      BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      TELETHON_SESSION_NAME: ${{ github.workspace }}/fuel_monitor
      MAX_ENABLED: "true"
      MAX_SESSION_PATH: ${{ github.workspace }}/.local/max/max_web_session.db
      PUBLISHED_STATE_PATH: ${{ github.workspace }}/.runtime-state/published-source-messages.json
      DRY_RUN: ${{ (github.event_name == 'schedule' || inputs.publish) && '0' || '1' }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install dependencies
        run: python -m pip install --upgrade pip && python -m pip install -r requirements.txt
      - name: Restore Telethon session
        env:
          TELETHON_SESSION_B64: ${{ secrets.TELETHON_SESSION_B64 }}
        run: |
          python - <<'PY'
          import base64
          import os

          encoded = os.environ["TELETHON_SESSION_B64"]
          with open("fuel_monitor.session", "wb") as session_file:
              session_file.write(base64.b64decode(encoded, validate=False))
          PY
      - name: Restore MAX session
        env:
          MAX_SESSION_GZ_B64: ${{ secrets.MAX_SESSION_GZ_B64 }}
        run: |
          python - <<'PY'
          import base64
          import gzip
          import os
          from pathlib import Path

          encoded = os.environ["MAX_SESSION_GZ_B64"]
          session = gzip.decompress(base64.b64decode(encoded, validate=True))
          if not session:
              raise RuntimeError("MAX session restore produced an empty file")
          session_path = Path(".local/max/max_web_session.db")
          session_path.parent.mkdir(parents=True, exist_ok=True)
          session_path.write_bytes(session)
          if not session_path.is_file() or session_path.stat().st_size == 0:
              raise RuntimeError("MAX session restore failed")
          PY
      - name: Restore runtime publish state
        run: |
          mkdir -p .runtime-state
          git fetch --no-tags origin runtime-state
          state_head="$(git rev-parse origin/runtime-state)"
          echo "RUNTIME_STATE_HEAD=$state_head" >> "$GITHUB_ENV"
          git show "$state_head:published-source-messages.json" > .runtime-state/published-source-messages.json
          python - <<'PY'
          from app.services.published_state import PublishedMessageStore

          PublishedMessageStore(".runtime-state/published-source-messages.json").load()
          PY
      - name: Run fuel monitor
        run: python -m app.runner
      - name: Update runtime publish state
        if: ${{ github.event_name == 'schedule' || inputs.publish }}
        run: |
          if cmp -s .runtime-state/published-source-messages.json <(git show "$RUNTIME_STATE_HEAD:published-source-messages.json"); then
            echo "Runtime state unchanged; no state commit created."
            exit 0
          fi

          git fetch --no-tags origin runtime-state
          if [ "$(git rev-parse origin/runtime-state)" != "$RUNTIME_STATE_HEAD" ]; then
            echo "Runtime state changed remotely; refusing to overwrite it."
            exit 1
          fi

          state_worktree="$(mktemp -d)/runtime-state"
          trap 'git worktree remove --force "$state_worktree" || true' EXIT
          git worktree add --detach "$state_worktree" "$RUNTIME_STATE_HEAD"
          cp .runtime-state/published-source-messages.json "$state_worktree/published-source-messages.json"
          git -C "$state_worktree" add published-source-messages.json
          git -C "$state_worktree" diff --cached --check
          git -C "$state_worktree" -c user.name="github-actions[bot]" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" commit -m "Update published source state"
          git -C "$state_worktree" push origin HEAD:runtime-state
