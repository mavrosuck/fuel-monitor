name: Emergency Telegram preflight

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install Telegram client
        run: python -m pip install 'aiogram>=3.13,<4' 'tzdata>=2025.2'
      - name: Verify existing bot and destination without sending
        env:
          BOT_TOKEN: ${{ secrets.BOT_TOKEN }}
        run: python -m app.emergency_alerts telegram-preflight
