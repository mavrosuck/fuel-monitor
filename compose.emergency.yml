services:
  emergency:
    profiles: [emergency]
    build: .
    command: [python, -m, app.emergency_alerts, run]
    env_file: .env.emergency
    environment:
      EMERGENCY_SQLITE_PATH: /state/alerts.sqlite3
      MAX_SESSION_PATH: /session/max.db
      EMERGENCY_POLL_SECONDS: "30"
    volumes:
      - ${EMERGENCY_STATE_DIR:?durable private directory required}:/state
      - ${EMERGENCY_SESSION_DIR:?existing private session directory required}:/session
    read_only: true
    tmpfs: [/tmp]
    cap_drop: [ALL]
    security_opt: [no-new-privileges:true]
    init: true
    restart: unless-stopped
    stop_grace_period: 45s
    healthcheck:
      test: [CMD, python, -m, app.emergency_alerts, health]
      interval: 30s
      timeout: 10s
      retries: 3
